[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "parallaxgen"
version = "0.1.0"
description = "Desktop pipeline for generating spatial depth wallpaper packages"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26",
    "opencv-python>=4.9",
    "pillow>=10.0",
    "torch>=2.2",
    "torchvision>=0.17",
    "transformers>=4.40",
    "kornia>=0.7",
    "timm>=1.0",
    "tqdm>=4.66",
    "typer>=0.12",
    "diffusers>=0.31",
    "accelerate>=0.30",
    "depth-pro"
]

[project.scripts]
parallaxgen = "parallaxgen.cli:app"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
