[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "parallaxgen"
version = "0.1.0"
description = "Desktop pipeline for generating spatial depth wallpaper packages"
readme = "../project.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26",
    "pillow>=10.0",
    "typer>=0.12",
]

[project.optional-dependencies]
ml = [
    "opencv-python>=4.9",
    "simple-lama-inpainting>=0.1.2",
    "timm>=1.0",
    "torch>=2.2",
    "torchvision>=0.17",
    "tqdm>=4.66",
]

[project.scripts]
parallaxgen = "parallaxgen.cli:app"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
